<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>The Perfect Wedding Promotional Video</title>

  <style>
    body {

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      color: #d96b7c;
      margin-bottom: 25px;
      font-size: 2.2rem;
    }

    video {
      width: 100%;
      max-width: 800px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      background: #000;
    }

      margin-top: 30px;
    }

    .app-store-button img {
      max-width: 260px;
      width: 80%;
      height: auto;
      transition: transform 0.2s ease;
    }

    <div class="app-store-button">

      </a>
    </div>

  </div>

</body>
</html>
